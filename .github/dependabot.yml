# Keeps the pinned GitHub Actions and the tools' Python packages current (pull requests, weekly).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    groups:
      tools:
        patterns: ['*']
